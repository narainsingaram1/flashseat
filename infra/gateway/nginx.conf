worker_processes auto;
worker_rlimit_nofile 65536;
events { worker_connections 16384; }

http {
  access_log off;
  resolver 127.0.0.11 valid=2s ipv6=off;

  # Behind a public reverse proxy (Caddy in docker-compose.prod.yml), trust its
  # X-Forwarded-For from the private Docker network so limits apply per visitor.
  # k6 reaches the gateway directly and sends no such header.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Starting sales and injecting faults are public actions; cap them per
  # visitor. GETs map to an empty key, which nginx never limits.
  map $request_method $control_write_key { POST $binary_remote_addr; default ""; }
  limit_req_zone $control_write_key zone=control_writes:10m rate=12r/m;
  limit_conn_zone $binary_remote_addr zone=streams:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Every API replica, re-resolved through Docker DNS so restarted or scaled
  # replicas join automatically. Requests are spread by least connections.
  upstream api {
    zone api 64k;
    least_conn;
    server api:8080 resolve max_fails=1 fail_timeout=2s;
    keepalive 512;
  }

  upstream control {
    zone control 64k;
    server control:8081 resolve;
    keepalive 16;
  }

  server {
    listen 8080;
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    # Never replay a POST on another replica: holds and checkouts are not
    # idempotent without the client's key, so a failed attempt surfaces to the
    # client, which retries with the same Idempotency-Key.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;

    location /internal/ { return 404; }

    location /api/v1/control/stream {
      proxy_pass http://control/control/stream;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      limit_conn streams 8;
    }

    location /api/v1/control/ {
      limit_req zone=control_writes burst=6 nodelay;
      proxy_pass http://control/control/;
    }

    location / {
      proxy_pass http://api;
    }
  }
}
