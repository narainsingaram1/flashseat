worker_processes auto;
worker_rlimit_nofile 65536;
events { worker_connections 16384; }

http {
  access_log off;
  resolver 127.0.0.11 valid=2s ipv6=off;

  # Every API replica, re-resolved through Docker DNS so restarted or scaled
  # replicas join automatically. Requests are spread by least connections.
  upstream api {
    zone api 64k;
    least_conn;
    server api:8080 resolve max_fails=1 fail_timeout=2s;
    keepalive 512;
  }

  upstream control {
    zone control 64k;
    server control:8081 resolve;
    keepalive 16;
  }

  server {
    listen 8080;
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    # Never replay a POST on another replica: holds and checkouts are not
    # idempotent without the client's key, so a failed attempt surfaces to the
    # client, which retries with the same Idempotency-Key.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;

    location /internal/ { return 404; }

    location /api/v1/control/stream {
      proxy_pass http://control/control/stream;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location /api/v1/control/ {
      proxy_pass http://control/control/;
    }

    location / {
      proxy_pass http://api;
    }
  }
}
